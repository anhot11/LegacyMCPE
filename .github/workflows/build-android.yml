name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="30"
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            build-essential ninja-build zip aapt zipalign apksigner dalvik-exchange libgl-dev libglu1-mesa-dev libsdl2-dev
          python3 -m pip install --break-system-packages meson

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Add NDK Toolchain to PATH
        run: |
          echo "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Validate Shaders & GPU Compatibility
        run: |
          python3 scripts/validate_shaders.py

      - name: Build libMinecraftClient.so
        run: |
          meson subprojects download || true
          find subprojects -name "SDL_steam_virtual_gamepad.h" -exec sed -i '1s/^/#pragma once\n/' {} + || true
          python3 scripts/patch_sdl2_android.py
          meson setup build_android --cross-file scripts/android_arm64.ini \
            -Drenderer=gles \
            -Dui_backend=java \
            -Dbuildtype=release \
            -Dsdl2:unity=off \
            -Denable_mimalloc=disabled
          ninja -C build_android targets/app/libMinecraftClient.so
          if [ -f build_android/targets/app/libMinecraftClient.so ]; then
            cp build_android/targets/app/libMinecraftClient.so android-launcher/android/lib/arm64-v8a/
            echo "Successfully built and copied libMinecraftClient.so"
          else
            echo "libMinecraftClient.so not found or build failed"
            exit 1
          fi

      - name: Bundle Game Assets
        run: |
          python3 scripts/pack_game_assets.py MCPL-Data.zip
          ls -lh MCPL-Data.zip

      - name: Build Launcher APK
        run: |
          cd android-launcher
          export PREFIX=/usr
          sudo mkdir -p /usr/lib/android-sdk/platforms/android-30
          wget -q https://dl.google.com/android/repository/platform-30_r03.zip -O /tmp/platform-30.zip
          unzip -q /tmp/platform-30.zip -d /tmp/platform-30-extract
          sudo mv /tmp/platform-30-extract/android-11/* /usr/lib/android-sdk/platforms/android-30/ || true
          sudo mkdir -p /usr/share/java
          sudo ln -sf /usr/lib/android-sdk/platforms/android-30/android.jar /usr/share/java/android.jar
          which dx || sudo ln -sf /usr/lib/android-sdk/build-tools/debian/dx /usr/bin/dx || true
          
          python3 waf configure -T release --termux
          python3 waf build
          ls -lh build/android/mod-signed.apk
          cp build/android/mod-signed.apk ../MCPL-Public.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCPL-Public-build
          path: |
            MCPL-Public.apk
            MCPL-Data.zip
          retention-days: 14

      - name: Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.15 MCPL-Public.apk MCPL-Data.zip --title "LegacyMCPE v1.0.15" --notes "Release v1.0.15: Giro de cámara fluido sin saltos ni congelamientos, indicador de minado dinámico que sigue al dedo, y desproyección de raycast 3D matemáticamente exacta con Camera::unprojectTouchRay." || gh release upload v1.0.15 MCPL-Public.apk MCPL-Data.zip --clobber || true
          gh release upload v1.0.14 MCPL-Public.apk MCPL-Data.zip --clobber || true
          gh release upload v1.0.13 MCPL-Public.apk MCPL-Data.zip --clobber || true
          gh release upload v1.0.12 MCPL-Public.apk MCPL-Data.zip --clobber || true
          gh release upload v1.0.11 MCPL-Public.apk MCPL-Data.zip --clobber || true
          gh release upload v1.0.10 MCPL-Public.apk MCPL-Data.zip --clobber || true
          gh release upload v1.0.1 MCPL-Public.apk MCPL-Data.zip --clobber || true
          gh release upload v1.0.0 MCPL-Public.apk MCPL-Data.zip --clobber || true

