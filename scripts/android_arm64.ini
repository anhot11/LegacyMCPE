[binaries]
c = 'aarch64-linux-android30-clang'
cpp = 'aarch64-linux-android30-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'false'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[built-in options]
c_args = ['-DANDROID', '-fPIC']
cpp_args = ['-DANDROID', '-fPIC']
cpp_link_args = ['-llog', '-landroid', '-lGLESv2', '-lEGL']
